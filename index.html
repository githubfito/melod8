<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MelodEight Web Piano</title>
    <link rel="stylesheet" href="/style.css"> 
</head>
<body>

    <h1>MELOD8 Web Piano</h1>

    <div id="status-line">
        Octava: <span id="octave-factor">x1.00</span> | Notas: <span id="note-count">0</span> | Duración: <span id="duration-ms">150</span> ms | Archivo: <span id="file-name">CANCION.MUS</span>
    </div>
    
    <div id="keyboard">
        <div class="key white-key" data-code="KeyA">A</div>
        <div class="key white-key" data-code="KeyS">S</div>
        <div class="key white-key" data-code="KeyD">D</div>
        <div class="key white-key" data-code="KeyF">F</div>
        <div class="key white-key" data-code="KeyG">G</div>
        <div class="key white-key" data-code="KeyH">H</div>
        <div class="key white-key" data-code="KeyJ">J</div>
        <div class="key white-key" data-code="KeyK">K</div>
        <div class="key white-key" data-code="KeyL">L</div>
        <div class="key white-key" data-code="Semicolon">Ñ (;)</div>
        <div class="key white-key" data-code="Quote">' (´)</div>
        <div class="key white-key" data-code="Backslash">Ç (\)</div>

        <div class="key black-key" data-code="KeyW">W</div>
        <div class="key black-key" data-code="KeyE">E</div>
        <div class="key black-key" data-code="KeyT">T</div>
        <div class="key black-key" data-code="KeyY">Y</div>
        <div class="key black-key" data-code="KeyU">U</div>
        <div class="key black-key" data-code="KeyI">I</div>
        <div class="key black-key" data-code="KeyO">O</div>
        <div class="key black-key" data-code="KeyP">P</div>
        <div class="key black-key" data-code="KeyOemOpenBrackets">[ +</div>
    </div>
    <div id="controls">
        <button onclick="piano.handleCommand('0')">[0] Borrar</button>
        <button onclick="piano.handleCommand('1')">[1] Cargar (.MUS)</button>
        <button onclick="piano.handleCommand('2')">[2] Guardar (.MUS)</button>
        <button onclick="piano.handleCommand('3')">[3] Reproducir</button>
        <button onclick="piano.handleCommand('4')">[4] CPC BASIC</button>
        <button onclick="piano.handleCommand('5')">[5] PB BASIC</button>
        <button onclick="piano.handleCommand('6')">[6] ZX BASIC</button>
        <button onclick="piano.handleCommand(',')">[ , ] Octava -</button>
        <button onclick="piano.handleCommand('.')">[ . ] Octava +</button>
        <button onclick="piano.handleCommand('m')">[M] Ayuda</button>
        <input type="checkbox" id="export-as-data" onchange="window.piano.setExportAsData(this.checked)">
        <label for="export-as-data">Exportar como DATA</label>
    </div>

    <input type="file" id="file-input" accept=".mus" style="display:none;" onchange="window.piano.cargarMelodiaDesdeInput(this.files)">

    <h2>Log del Sistema</h2>
    <pre id="log-area"></pre>

    <script src="https://unpkg.com/midi-writer-js@2.1.2/dist/midi-writer-js.js"></script>
    <script src="piano.js"></script> 
</body>
</html>
