<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MelodEight Web Piano</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <h1>
        MELOD8 Web Piano
        <span id="header-details">
            <span id="credit-by-fito">by fito</span> 
            <span id="version-text"></span>
        </span>
    </h1>

    <div id="status-line">
        Octave: <span id="octave-factor">x1.00</span> | Notes: <span id="note-count">0</span> | Duration: <span id="duration-ms">150</span> ms | File: <span id="file-name">SONG.MUS</span>
    </div>
    
    <div id="keyboard">
        <div class="key white-key" data-code="KeyA">A</div>
        <div class="key white-key" data-code="KeyS">S</div>
        <div class="key white-key" data-code="KeyD">D</div>
        <div class="key white-key" data-code="KeyF">F</div>
        <div class="key white-key" data-code="KeyG">G</div>
        <div class="key white-key" data-code="KeyH">H</div>
        <div class="key white-key" data-code="KeyJ">J</div>
        <div class="key white-key" data-code="KeyK">K</div>
        <div class="key white-key" data-code="KeyL">L</div>
        <div class="key white-key" data-code="Semicolon">; (Ñ)</div>
        <div class="key white-key" data-code="Quote">' (´)</div>
        <div class="key white-key" data-code="Backslash">\ (Ç)</div>

        <div class="key black-key" data-code="KeyW">W</div>
        <div class="key black-key" data-code="KeyE">E</div>
        <div class="key black-key" data-code="KeyT">T</div>
        <div class="key black-key" data-code="KeyY">Y</div>
        <div class="key black-key" data-code="KeyU">U</div>
        <div class="key black-key" data-code="KeyO">O</div>
        <div class="key black-key" data-code="KeyP">P</div>
        <div class="key black-key" data-code="BracketRight">] }</div> </div>
    
    <div id="controls">
        <button onclick="piano.handleCommand('0')">[0] Clear</button>
        <button onclick="piano.handleCommand('1')">[1] Load (.MUS)</button>
        <button onclick="piano.handleCommand('2')">[2] Save (.MUS)</button>
        <button onclick="piano.handleCommand('3')">[3] Play</button>
        <button onclick="piano.handleCommand('4')">[4] CPC</button> <button onclick="piano.handleCommand('5')">[5] PB</button> <button onclick="piano.handleCommand('6')">[6] ZX</button> <button onclick="piano.changeInstrument(-1)">[Z] Ins-</button>  <button onclick="piano.changeInstrument(1)">[X] Ins+</button>  <button onclick="piano.handleCommand(',')">[ , ] Oct-</button> <button onclick="piano.handleCommand('.')">[ . ] Oct+</button> <button onclick="piano.handleCommand('m')">[M] Help</button>
        <input type="checkbox" id="export-as-data" onchange="window.piano.setExportAsData(this.checked)">
        <label for="export-as-data">Export as DATA</label>
    </div>

    <input type="file" id="file-input" accept=".mus" style="display:none;">

    <h2>System Log</h2>
    <pre id="log-area"></pre>

    <script src="https://unpkg.com/midi-writer-js@2.1.2/dist/midi-writer-js.min.js"></script>
    <script src="piano.js"></script> 
</body>
</html>
